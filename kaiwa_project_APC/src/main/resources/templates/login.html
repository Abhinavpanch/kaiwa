<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login — Kaiwa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind Play CDN config: fade-up entrance animation
        tailwind.config = {
            theme: {
                extend: {
                    keyframes: {
                        'fade-up': {
                            '0%': { opacity: '0', transform: 'translateY(24px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    },
                    animation: {
                        'fade-up': 'fade-up 0.7s cubic-bezier(0.22, 1, 0.36, 1) both'
                    }
                }
            }
        };
    </script>
</head>

<body class="relative flex min-h-screen items-center justify-center overflow-hidden bg-gradient-to-tr from-indigo-900 via-purple-900 to-pink-800 p-6 font-sans antialiased">

    <!-- Ambient background blobs -->
    <div class="pointer-events-none absolute -left-32 -top-32 h-96 w-96 rounded-full bg-fuchsia-500 opacity-40 blur-3xl"></div>
    <div class="pointer-events-none absolute -right-24 top-1/3 h-80 w-80 rounded-full bg-cyan-400 opacity-30 blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-40 left-1/4 h-96 w-96 rounded-full bg-indigo-400 opacity-40 blur-3xl"></div>

    <main class="relative z-10 w-full max-w-md animate-fade-up">

        <!-- Glass card -->
        <div class="relative rounded-3xl border border-white/20 bg-white/10 p-8 shadow-2xl shadow-black/40 backdrop-blur-lg md:p-10">

            <!-- Inset top highlight -->
            <div class="pointer-events-none absolute inset-x-6 top-0 h-px bg-gradient-to-r from-transparent via-white/60 to-transparent"></div>
            <div class="pointer-events-none absolute inset-0 rounded-3xl bg-gradient-to-b from-white/15 via-transparent to-transparent"></div>

            <div class="relative">
                <h2 class="text-center text-3xl font-bold text-white">Welcome Back!</h2>
                <p class="mt-2 text-center text-sm text-white/60">Sign in to continue to Kaiwa Chat</p>

                <form th:action="@{/login}" method="post" class="mt-8 space-y-5">
                    <div>
                        <label for="username" class="mb-2 block text-sm font-medium text-white/70">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required
                               class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-white placeholder-white/40 outline-none transition focus:border-white/40 focus:bg-white/10 focus:ring-2 focus:ring-white/20" />
                    </div>
                    <div>
                        <label for="password" class="mb-2 block text-sm font-medium text-white/70">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required
                               class="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-white placeholder-white/40 outline-none transition focus:border-white/40 focus:bg-white/10 focus:ring-2 focus:ring-white/20" />
                    </div>
                    <label class="flex items-center gap-2 text-sm text-white/60">
                        <input type="checkbox" name="remember-me" id="remember-me" class="h-4 w-4 rounded accent-indigo-400" />
                        Remember me
                    </label>
                    <button type="submit"
                            class="w-full rounded-xl bg-white/20 px-6 py-3 text-base font-semibold text-white shadow-lg transition hover:bg-white/30 focus:outline-none focus:ring-2 focus:ring-white/40 active:scale-[0.99]">
                        Login
                    </button>
                </form>

                <p class="mt-8 text-center text-sm text-white/60">
                    Don't have an account?
                    <a th:href="@{/register}" class="font-semibold text-white/90 underline decoration-white/30 underline-offset-4 transition hover:text-white">Sign Up Here</a>
                </p>
            </div>
        </div>
    </main>
</body>
</html>
